name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: standalone/package-lock.json
      - run: npm ci --prefix standalone --ignore-scripts
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm test --prefix standalone
      - run: node --check standalone/bridge.js
